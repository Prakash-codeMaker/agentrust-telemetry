name: Validate AgenTrust PR 132

on:
  push:
    branches:
      - feat/source-classification-inheritance

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned test dependencies
        run: python -m pip install --require-hashes -r requirements/test.txt
      - name: Install local package
        run: python -m pip install --no-deps -e .
      - name: Check workflow OIDC contract
        run: python tools/check_workflow_oidc.py
      - name: Check SDK versions
        run: python tools/check_versions.py
      - name: Check schemas
        run: python tools/check_schemas.py
      - name: Check OpenTelemetry compatibility
        run: python tools/check_otel_compatibility.py
      - name: Check TypeScript schemas
        run: python tools/check_typescript_schemas.py
      - name: Validate conformance fixtures
        run: python conformance/runner/validate.py
      - name: Run Python test suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Smoke-test packed npm artifact
        run: |
          mkdir -p ../../npm-dist
          npm pack --pack-destination ../../npm-dist
          node ../../tools/smoke_npm.mjs ../../npm-dist/*.tgz
          node ../../tools/test_smoke_npm.mjs ../../npm-dist/*.tgz
